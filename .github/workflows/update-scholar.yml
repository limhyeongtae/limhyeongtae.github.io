# Weekly refresh of the citation numbers on the home page (assets/data/scholar.json).
# Runs every Monday 03:17 UTC (12:17 in Korea). To run it now: Actions tab -> "Update Google Scholar stats" -> Run workflow.
name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Google Scholar
        run: python3 .github/scripts/update_scholar.py assets/data/scholar.json

      - name: Commit if the numbers or the check date changed
        run: |
          if git diff --quiet; then
            echo "No change (Scholar blocked the request or nothing new)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git commit -m "Update Google Scholar stats"
          git push
          # make sure GitHub Pages republishes the site with the new file
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
